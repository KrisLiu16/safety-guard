apiVersion: batch/v1
kind: Job
metadata:
  name: safety-guard-serving-inspect-20260924-r1
  namespace: default
  labels:
    app: safety-guard-serving-inspect
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        app: safety-guard-serving-inspect
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: "172.19.1.144"
      containers:
        - name: inspect
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: [bash, -lc]
          args:
            - |
              for i in $(seq 1 5000); do
                if test -f /work/output/round6/serving_inspect_done; then exit 0; fi
                sleep 1
              done
              exit 0
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: safety-guard-base-compare-data
