apiVersion: batch/v1
kind: Job
metadata:
  name: safety-guard-stage2-backbone-v2-r1
  namespace: default
  labels:
    app: safety-guard-stage2-backbone-v2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 50400
  template:
    metadata:
      labels:
        app: safety-guard-stage2-backbone-v2
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: "172.19.1.144"
      containers:
        - name: stage1
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,uuid,memory.total --format=csv,noheader
              python -c 'import torch; assert torch.cuda.device_count()==1; assert "L20" in torch.cuda.get_device_name(0)'
              mkdir -p /work/round6/stage1_head /work/round6/stage2 /work/output/round6
              for i in $(seq 1 3600); do
                if test -f /work/round6/stage2_backbone_v2_input_ready; then break; fi
                sleep 1
              done
              test -f /work/round6/stage2_backbone_v2_input_ready
              apt-get update > /work/output/round6/stage2_backbone_v2_compiler_install.log 2>&1
              apt-get install -y --no-install-recommends gcc libc6-dev >> /work/output/round6/stage2_backbone_v2_compiler_install.log 2>&1
              set +e
              L=${LABELS_DIR}
              O=/work/output/round6
              /work/modern/bin/python -B /work/round6/stage2/build_targets.py --runA-labels $L/runA_stage1/labels.jsonl --prompt-labels $L/user_runA_stage1/labels.jsonl --prefix-labels $L/prefix_v2/labels.jsonl --prefix-user-labels $L/user_prefix_v2/labels.jsonl --leader-rows /work/round6/leader_v1/examples.jsonl --leader-labels $L/leader_v1/labels.jsonl --output $O/stage2_targets_v2 > $O/stage2_targets_v2.log 2>&1
              targets=$?
              smoke=skipped; train=skipped; eval_a=skipped; eval_u=skipped
              if test "$targets" = 0; then
                /work/modern/bin/python -B /work/round6/stage2/train_stage2.py $O/stage2_targets_v2 --smoke 4 --output $O/stage2_smoke_v2 > $O/stage2_smoke_v2.log 2>&1
                smoke=$?
              fi
              if test "$smoke" = 0; then
                /work/modern/bin/python -B /work/round6/stage2/train_stage2.py $O/stage2_targets_v2 --alert-cut 0.4 --output $O/stage2_train_v2 > $O/stage2_train_v2.log 2>&1
                train=$?
              fi
              if test "$train" = 0; then
                /work/modern/bin/python -B /work/round6/stage1_head/eval_head_l20.py --variants checkpoint --checkpoint $O/stage2_train_v2/best.safetensors --output $O/stage2_eval_assistant_v2 > $O/stage2_eval_assistant_v2.log 2>&1
                eval_a=$?
                /work/modern/bin/python -B /work/round6/stage1_head/eval_head_l20.py --role user --variants checkpoint --checkpoint $O/stage2_train_v2/best.safetensors --output $O/stage2_eval_user_v2 > $O/stage2_eval_user_v2.log 2>&1
                eval_u=$?
                /work/modern/bin/python -B /work/round6/stage2/score_texts_l20.py /work/round6/stage2_spot/leader_dev_cases.jsonl --checkpoint $O/stage2_train_v2/best.safetensors /work/output/round6/stage2_train_v1/best.safetensors --output $O/stage2_spot_leader_v2.jsonl > $O/stage2_spot_leader_v2.log 2>&1 || true
              fi
              set -e
              echo "targets=$targets smoke=$smoke train=$train eval_assistant=$eval_a eval_user=$eval_u" > /work/output/round6/stage2_backbone_v2_exit_code.txt
              touch /work/output/round6/stage2_backbone_v2_done
              for i in $(seq 1 3600); do
                if test -f /work/output/round6/stage2_backbone_v2_collected; then exit 0; fi
                sleep 1
              done
              echo 'collection timed out' >&2
              exit 1
          env:
            - name: LABELS_DIR
              value: /work/round6/redline_v1/labels_v2_alert
            - name: HF_HOME
              value: /work/hf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TRITON_CACHE_DIR
              value: /work/triton-cache
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 40Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: safety-guard-base-compare-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
