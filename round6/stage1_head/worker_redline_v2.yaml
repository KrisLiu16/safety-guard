apiVersion: batch/v1
kind: Job
metadata:
  name: safety-guard-stage1-redline-v2-r1
  namespace: default
  labels:
    app: safety-guard-stage1-redline-v2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: safety-guard-stage1-redline-v2
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: "172.19.1.144"
      containers:
        - name: stage1
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              nvidia-smi --query-gpu=name,uuid,memory.total --format=csv,noheader
              python -c 'import torch; assert torch.cuda.device_count()==1; assert "L20" in torch.cuda.get_device_name(0)'
              mkdir -p /work/round6/stage1_head /work/output/round6
              for i in $(seq 1 3600); do
                if test -f /work/round6/stage1_redline_v2_input_ready; then break; fi
                sleep 1
              done
              test -f /work/round6/stage1_redline_v2_input_ready
              apt-get update > /work/output/round6/stage1_redline_v2_compiler_install.log 2>&1
              apt-get install -y --no-install-recommends gcc libc6-dev >> /work/output/round6/stage1_redline_v2_compiler_install.log 2>&1
              set +e
              /work/modern/bin/python -B /work/round6/stage1_head/relabel_cache.py /work/output/round6/stage1_cache_v1 --runA /work/round6/stage1_head/input_v1/stage1_runA_v1.jsonl --runA-labels /work/round6/redline_v1/labels/runA_stage1/labels.jsonl --prefix-labels /work/round6/redline_v1/labels/prefix_v2/labels.jsonl --output /work/output/round6/stage1_labels3_v2 > /work/output/round6/stage1_labels3_v2.log 2>&1
              relabel=$?
              train=skipped
              evaluate=skipped
              if test "$relabel" = 0; then
                /work/modern/bin/python -B /work/round6/stage1_head/train_head.py /work/output/round6/stage1_cache_v1 --labels3 /work/output/round6/stage1_labels3_v2 --output /work/output/round6/stage1_train_v2 > /work/output/round6/stage1_train_v2.log 2>&1
                train=$?
              fi
              if test "$train" = 0; then
                /work/modern/bin/python -B /work/round6/stage1_head/eval_head_l20.py --heads /work/output/round6/stage1_train_v2 --variants init,risk,full --output /work/output/round6/stage1_eval_v2 > /work/output/round6/stage1_eval_v2.log 2>&1
                evaluate=$?
              fi
              set -e
              echo "relabel=$relabel train=$train eval=$evaluate" > /work/output/round6/stage1_redline_v2_exit_code.txt
              touch /work/output/round6/stage1_redline_v2_done
              for i in $(seq 1 3600); do
                if test -f /work/output/round6/stage1_redline_v2_collected; then exit 0; fi
                sleep 1
              done
              echo 'collection timed out' >&2
              exit 1
          env:
            - name: HF_HOME
              value: /work/hf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TRITON_CACHE_DIR
              value: /work/triton-cache
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "8"
              memory: 40Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: safety-guard-base-compare-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
