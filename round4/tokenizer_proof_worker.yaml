apiVersion: batch/v1
kind: Job
metadata:
  name: safety-guard-tokenizer-proof-20260924-r1
  namespace: default
  labels:
    app: safety-guard-tokenizer-proof
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: "172.19.1.144"
      containers:
        - name: proof
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: [/work/modern/bin/python, /work/round4/eval_keyword_probe_v2.py]
          args:
            - --kind
            - candidate
            - --data-root
            - /work/validation/keyword_probe_v1
            - --base-root
            - /work
            - --reference-tokenizer-json
            - /work/output/qwen35_full/tokenizer/tokenizer.json
            - --write-tokenizer-compatibility
            - /work/round4/keyword_tokenizer_compatibility_v1.json
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: safety-guard-base-compare-data
