apiVersion: batch/v1
kind: Job
metadata:
  name: safety-guard-round4-artifacts-20260923-r1
  namespace: default
  labels:
    app: safety-guard-round4-artifacts
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: safety-guard-round4-artifacts
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: "172.19.1.144"
      containers:
        - name: artifacts
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              test -f /work/output/round4_validation/bundle/classifier.safetensors
              touch /work/output/round4_validation/download_worker_ready
              for i in $(seq 1 7000); do
                if test -f /work/output/round4_validation/weights_downloaded; then exit 0; fi
                sleep 1
              done
              exit 1
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: CUDA_VISIBLE_DEVICES
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: safety-guard-base-compare-data
